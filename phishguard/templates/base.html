<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PhishGuard{% endblock %} - PhishGuard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="nav">
    <a class="brand" href="{{ url_for('index') }}">&#128737; PhishGuard</a>
    <nav>
      <a href="{{ url_for('index') }}">Scan</a>
      <a href="{{ url_for('history') }}">History</a>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
    </nav>
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>All analysis runs locally. Submitted URLs are never opened.</footer>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
